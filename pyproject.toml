[project]
name = "ppe-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "fiftyone>=1.22.1",
    "opencv-python>=5.0.0.93",
    "torch==2.6.0+cu126",
    "torchvision==0.21.0+cu126",
    "ultralytics>=8.4.115",
]

[tool.uv]
# All OpenCV wheels share cv2. Use the GUI build for inference previews,
# including dependencies that otherwise pull in the headless build.
exclude-dependencies = ["opencv-python-headless"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"
